akka.actor {
  serializers {
    multi-journal-metadata = "akka.persistence.multijournal.MultiJournalMetadata$Serializer"
  }

  serialization-bindings {
    "akka.persistence.multijournal.MultiJournalMetadata" = multi-journal-metadata
  }

  serialization-identifiers {
    # Must not conflict with any serializer ID used in your application.  Once set, this serializer ID cannot be changed
    "akka.persistence.multijournal.MultiJournalMetadata$Serializer" = 565675678
  }
}

akka.persistence.multi-journal {
  class = "akka.persistence.multijournal.MultiJournal"
  
  # Inactivity duration for a persistence ID before cached metadata is evicted
  # This plugin caches discovered metadata for each persistence ID which recovers, writes, or deletes events.
  # The cost of this cache per persistence ID will typically be a few hundred bytes of heap consumption per journal;
  # the benefit of this cache is faster event writes.
  # If using time-based passivation strategies, this lifetime should exceed the configured passivation timeout.  More
  # generally, if more than this lifetime has passed since the last recovery or persist for a given persistent actor,
  # writes and deletions will perform an operation very similar to a recovery; performing a recovery may require
  # recovering more events than requested.
  metadata-cache-lifetime = 1 hour

  # The journals to be used by this plugin to actually store events
  # Journals must be keyed by non-negative integers, and those keys should not have gaps. It is strongly recommended
  # that the keys start with 0 (then 1, etc.). Event writes will be directed to the journal with the greatest key:
  # journals with lesser keys are only used for reads and deletes.
  #
  # This is an object and not a list because it is contemplated that older journals might eventually be removed.
  journals {
    # Example:
    # 0 = "akka.persistence.journals.cold-0"  # configuration path which will be used to configure journal 0
    # 1 = "akka.persistence.journals.hot"     # configuration path which will be used to configure journal 1
  }

  query {
    class = "akka.persistence.multijournal.query.MultiJournalReadJournalProvider"

    # The read-journals where the events are actually stored
    # Journals must be keyed by non-negative integers and those keys should not have gaps; the keys
    # must also correspond to the keys used by the journal in the journals stanza.
    read-journals {
      # Example:
      # 0 = "akka.persistence.journals.cold-0.query"  # configuration path which will be used to configure read-journal 0
      # 1 = "akka.persistence.journals.hot.query"     # configuration path which will be used to configure read-journal 1
    }
    
    # When joining live event streams from multiple journals, for a given slice, this window controls the maximum duration
    # by which the furthest ahead journal is ahead of the aggregate cooler journals, with idle journals being accounted for.
    # Successive events in the stream for a given slice may be out-of-timestamp-order by up to this duration plus
    # cold-journal-behind-current-time
    #
    # Increasing this window will mean cooler journals are queried less frequently, at the cost of a larger deduplication
    # window in the consumer.
    #
    # Deduplication logic in consumers should be configured with awareness of this window: specifically, projection offset
    # store time-window needs to be at least this duration plus cold-journal-behind-current-time
    #
    # Must be strictly greater than cold-journal-behind-current-time.
    query-time-window = 2 minutes

    # In the "live" events-by-slice query, the cooler journals are queried via current-events-by-slice
    # These queries are eventually expected to return no events, so each such query will be considered to have
    # made progress to at least the time when the query was started minus this duration. This setting is analogous
    # to "eventual-consistency-delay" settings in other plugins (events are expected to become visible in the
    # current-events-by-slice query within this duration from being written).
    #
    # Concretely, if a live events-by-slice query starts current-events-by-slice queries on the cooler journals
    # at time T, then by the time those queries complete, events from the hot-journal with timestamps at most
    # T - cold-journal-behind-current-time + query-time-window would be emittable (if the current-events-by-slice
    # queries emit events, they will incrementally move progress forward)
    #
    # Cooler queries resume from this duration before their latest offset, with an empty seen map. This allows an
    # event that was slower than its peers to become visible in a cooler journal after a later-timestamped event was
    # already observed. It also means events within this window may be emitted more than once. A cooler query which
    # advances beyond the previous latest offset is followed by another query within half this duration.
    #
    # Cooler queries are also started proactively when the latest emitted or pending timestamp is more than the mean
    # of this duration and query-time-window ahead of cooler progress. This aims to advance cooler progress before a
    # hot event reaches the query-time-window limit and must be held back.
    #
    # Note that live events-by-slice queries reserve the right to emit events multiple times: it is recommended
    # that consumers deduplicate, e.g. by tracking seen sequence numbers by persistence ID or consume
    # using Akka Projections.
    #
    # Must be strictly less than query-time-window and must be at least 1 millisecond
    cold-journal-behind-current-time = 10 seconds
  }
}
